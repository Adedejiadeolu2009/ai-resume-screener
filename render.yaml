services:
  - type: web
    name: aptura-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://aptura-ai.onrender.com
      - key: ALLOWED_HOSTS
        value: aptura-ai.onrender.com,*.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aptura-ai-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_BASE
        sync: false
      - key: GROQ_MODEL_NAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MANUAL_TRANSFER_BANK_NAME
        sync: false
      - key: MANUAL_TRANSFER_ACCOUNT_NUMBER
        sync: false
      - key: MANUAL_TRANSFER_ACCOUNT_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

databases:
  - name: aptura-ai-db
    plan: free
