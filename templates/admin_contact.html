<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Aptura AI</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0a0b0e;
        color: #f0ede6;
        margin: 0;
        padding: 0;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      a {
        color: #c9a84c;
      }
      .card {
        background: #13151c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        font-weight: 700;
        font-size: 24px;
        margin: 0 0 10px;
      }
      p {
        color: #9a9691;
        line-height: 1.6;
      }
      .row {
        margin-top: 14px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tag {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(201, 168, 76, 0.25);
        background: rgba(201, 168, 76, 0.08);
        color: #c9a84c;
        font-weight: 700;
        font-size: 12px;
      }
      footer {
        margin-top: 20px;
        color: #5a5750;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="row">
          <span class="tag">CONTACT</span>
        </div>
        <h1>Contact admin</h1>
        <p>
          Email us to confirm your bank transfer and activate your
          Pro/Enterprise plan.
        </p>
        <p><strong>apturaai7@gmail.com</strong></p>
        <p>
          For security, include the reference you received after requesting
          activation on the Plans page.
        </p>
        <footer>© Aptura AI 2026</footer>
      </div>
    </div>
  </body>
</html>
